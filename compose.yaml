services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: procureflow
      POSTGRES_DB: procureflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://procureflow:procureflow@db:5432/procureflow
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/.data
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
  backend_data:
